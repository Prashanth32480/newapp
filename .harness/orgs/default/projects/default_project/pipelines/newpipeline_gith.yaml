pipeline:
  id: newpipeline_gith
  name: newpipeline gith
  description: My first Harness pipeline. Builds a Docker image from the newapp repository and pushes it to Harness Artifact Registry.
  tags:
    ai_generated: ""
  inputs:
    registry:
      type: string
      required: true
      description: Harness Artifact Registry to push the image to
    package_name:
      type: string
      required: true
      description: Docker package (image) name without a tag
    image_tag:
      type: string
      required: true
      description: Tag for the Docker image
  clone:
    enabled: true
    connector: connector_Github_c63e
    repo: Prashanth32480/newapp
    ref:
      type: branch
      name: main
  stages:
    - id: build
      name: Build
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: build_and_push
          name: Build and Push Image
          build:
            uses: buildAndPushToHAR
            with:
              registry: ${{ inputs.registry }}
              package_name: ${{ inputs.package_name }}
              tags:
                - ${{ inputs.image_tag }}
